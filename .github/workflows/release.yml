name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the source version
        run: |
          version=$(sed -n 's/.*static let current = "\(.*\)".*/\1/p' Sources/SquishCore/Version.swift)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match SquishVersion.current $version"
            exit 1
          fi

      - name: Install afsctool
        run: brew install afsctool

      - name: Test
        run: swift test 2>&1 | tee test.log

      - name: Fail on skipped tests
        run: |
          if grep -E "Test Case .* skipped" test.log; then
            echo "::error::tests were skipped"
            exit 1
          fi

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/squish"
          archs=$(lipo -archs "$bin")
          echo "architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::not a universal binary"; exit 1; }
          echo "BIN=$bin" >> "$GITHUB_ENV"

      - name: Package
        run: |
          archive="squish-$GITHUB_REF_NAME-macos.tar.gz"
          mkdir dist
          cp "$BIN" dist/squish
          cp README.md dist/
          tar -czf "$archive" -C dist .
          shasum -a 256 "$archive" > "$archive.sha256"
          cat "$archive.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" squish-*-macos.tar.gz* --title "$GITHUB_REF_NAME" --generate-notes
